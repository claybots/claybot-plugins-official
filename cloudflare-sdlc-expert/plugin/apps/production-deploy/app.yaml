# plugin/apps/production-deploy/app.yaml — the tool app_production_deploy.
# Generated by scripts/apps/build.py; change the spec there and rebuild.
# No csp: the page reaches nothing outside itself.

title: Production deploy
description: "Use at step 7.3, as the sign-off before a production deploy: shows the owner the worker, commit and preview, the checklist, each resource and data change with its risk, what ships, and the config diff, lets them hold back resource changes, and returns whether to deploy, keep it on preview, or stop."
mode: gate
input:
  type: object
  required: [title, commit, checks]
  properties:
    title:
      type: string
      description: "<worker> → <mode>."
    repo:
      type: string
    commit:
      type: string
      description: The short sha being deployed.
    mode:
      type: string
      description: The --mode the config is evaluated with.
    preview_url:
      type: string
      description: The preview deployment of the same code.
    checks:
      type: array
      items:
        type: object
        required: [name]
        properties:
          name:
            type: string
          status:
            type: string
            description: pass, fail, warn or pending.
          url:
            type: string
          detail:
            type: string
      description: The deploy checklist, one row per item.
    notes:
      type: string
      description: What ships, for users, and the rollback plan with the version now live, Markdown.
    resources:
      type: array
      items:
        type: object
        required: [id, title]
        properties:
          id:
            type: string
            description: Stable id, echoed back in values.hold.
          title:
            type: string
            description: "The binding and resource, e.g. DATABASE → example-production-database."
          kind:
            type: string
            description: d1, kv, r2, queue, vectorize, route, cron, secret, migration or other.
          action:
            type: string
            description: added, changed or removed.
          risk:
            type: string
            description: high, medium or low.
          detail:
            type: string
            description: "One line: what happens when it is applied."
      description: Every production resource, route, trigger and D1 migration the deploy creates or changes.
    files:
      type: array
      items:
        type: object
        required: [path, patch]
        properties:
          path:
            type: string
          patch:
            type: string
            description: "Unified diff of this file, @@ headers included."
          url:
            type: string
          status:
            type: string
            description: added, modified, removed or renamed.
      description: The diff of cloudflare.config.ts and migrations since the version now live, at most 10.
actions:
  - { id: deploy, label: Deploy to production, tone: primary }
  - { id: keep_preview, label: Keep it on preview, tone: neutral, note: optional }
  - { id: stop, label: Don't deploy, tone: danger, note: optional }
fields:
  type: object
  properties:
    comments:
      type: string
      title: Comments
      description: "JSON array of {target, quote, body}: the owner's comments."
      maxLength: 20000
    hold:
      type: string
      title: Resource changes
      description: JSON array of the ids the owner held back.
      maxLength: 8000
